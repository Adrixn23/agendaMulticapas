<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contactos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <div class="container navbar-content">
            <div class="brand">
                <span class="brand-title">Agenda</span>
                <span class="brand-badge">Multicapas</span>
            </div>
            <button id="btnNuevoContacto" class="btn btn-dark">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Nuevo contacto
            </button>
        </div>
    </header>

    <main class="container">
        <section class="toolbar">
            <div class="search-wrapper">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="inputBusqueda" placeholder="Buscar contactos..." autocomplete="off">
                <button type="button" id="btnLimpiarBusqueda" class="btn-clear" aria-label="Limpiar">&times;</button>
            </div>

            <div class="category-tabs" id="categoryTabs">
                <button type="button" class="tab-pill active" data-category="Todos">Todos</button>
                <button type="button" class="tab-pill" data-category="Trabajo">Trabajo</button>
                <button type="button" class="tab-pill" data-category="Familia">Familia</button>
                <button type="button" class="tab-pill" data-category="Amigos">Amigos</button>
                <button type="button" class="tab-pill" data-category="General">General</button>
            </div>
        </section>

        <section class="summary-line">
            <span id="txtResumen">Cargando...</span>
        </section>

        <section class="content-area">
            <div id="loader" class="state-box">
                <div class="spinner"></div>
                <p>Cargando contactos...</p>
            </div>

            <div id="emptyState" class="state-box hidden">
                <p class="empty-title">Sin resultados</p>
                <p class="empty-desc">No se encontraron contactos para el criterio actual.</p>
            </div>

            <div id="listaContactos" class="grid-contactos"></div>
        </section>
    </main>

    <div id="modalContacto" class="modal-backdrop hidden">
        <div class="modal-panel">
            <div class="modal-head">
                <h2 id="modalTitulo">Nuevo contacto</h2>
                <button type="button" class="btn-icon" id="btnCerrarModal" aria-label="Cerrar">&times;</button>
            </div>
            <form id="formContacto" novalidate>
                <input type="hidden" id="contactoId" value="">
                
                <div class="form-grid">
                    <div class="input-block">
                        <label for="inputNombre">Nombre</label>
                        <input type="text" id="inputNombre" name="nombre" required maxlength="50" placeholder="Nombre">
                        <span class="error-text" id="errorNombre"></span>
                    </div>
                    <div class="input-block">
                        <label for="inputApellido">Apellido</label>
                        <input type="text" id="inputApellido" name="apellido" required maxlength="50" placeholder="Apellido">
                        <span class="error-text" id="errorApellido"></span>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="input-block">
                        <label for="inputTelefono">Teléfono</label>
                        <input type="tel" id="inputTelefono" name="telefono" required maxlength="20" placeholder="+58 412 0000000">
                        <span class="error-text" id="errorTelefono"></span>
                    </div>
                    <div class="input-block">
                        <label for="inputEmail">Correo electrónico</label>
                        <input type="email" id="inputEmail" name="email" required maxlength="100" placeholder="correo@ejemplo.com">
                        <span class="error-text" id="errorEmail"></span>
                    </div>
                </div>

                <div class="input-block">
                    <label for="inputDireccion">Dirección</label>
                    <input type="text" id="inputDireccion" name="direccion" maxlength="150" placeholder="Dirección física (opcional)">
                    <span class="error-text" id="errorDireccion"></span>
                </div>

                <div class="form-grid align-center">
                    <div class="input-block">
                        <label for="selectCategoria">Categoría</label>
                        <select id="selectCategoria" name="categoria">
                            <option value="General">General</option>
                            <option value="Trabajo">Trabajo</option>
                            <option value="Familia">Familia</option>
                            <option value="Amigos">Amigos</option>
                        </select>
                    </div>
                    <div class="checkbox-row">
                        <input type="checkbox" id="checkFavorito" name="favorito">
                        <label for="checkFavorito">Marcar favorito</label>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-light" id="btnCancelarModal">Cancelar</button>
                    <button type="submit" class="btn btn-dark" id="btnGuardarContacto">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalConfirmar" class="modal-backdrop hidden">
        <div class="modal-panel modal-confirm">
            <div class="modal-head">
                <h2>Eliminar contacto</h2>
                <button type="button" class="btn-icon" id="btnCerrarConfirmar" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body-text">
                <p id="confirmarMensaje">¿Deseas eliminar este contacto?</p>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-light" id="btnCancelarEliminar">Cancelar</button>
                <button type="button" class="btn btn-danger" id="btnAceptarEliminar">Eliminar</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toasts"></div>

    <script src="js/services/apiService.js"></script>
    <script src="js/ui/uiManager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
